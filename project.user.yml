name: HeartRateLockWidget
options:
  bundleIdPrefix: com.awen
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: VCDMB9S3N2
    MARKETING_VERSION: "1.0.3"
    CURRENT_PROJECT_VERSION: "3"

targets:
  HeartRateLock:
    type: application
    platform: macOS
    sources:
      - path: HeartRateLock
      - path: HeartRateLockShared
    info:
      path: HeartRateLock/Info.plist
      properties:
        CFBundleShortVersionString: "1.0.3"
        CFBundleVersion: "3"
        CFBundleDisplayName: 不跳就锁
        LSUIElement: true
        NSBluetoothAlwaysUsageDescription: "HeartRateLock 需要蓝牙权限连接心率设备。"
    entitlements:
      path: HeartRateLock/HeartRateLock.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.network.client: true
        com.apple.security.bluetooth: true
        com.apple.security.application-groups:
          - group.com.awen.heartratelock
    settings:
      base:
        PRODUCT_NAME: 不跳就锁
        PRODUCT_BUNDLE_IDENTIFIER: com.awen.HeartRateLock
        CODE_SIGN_ENTITLEMENTS: HeartRateLock/HeartRateLock.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: HeartRateWidget

  HeartRateWidget:
    type: extensionkit-extension
    platform: macOS
    sources:
      - path: HeartRateWidget
      - path: HeartRateLockShared
    info:
      path: HeartRateWidget/Info.plist
      properties:
        CFBundleShortVersionString: "1.0.3"
        CFBundleVersion: "3"
        CFBundleDisplayName: HeartRateWidget
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: HeartRateWidget/HeartRateWidget.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - group.com.awen.heartratelock
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.awen.HeartRateLock.widget
        CODE_SIGN_ENTITLEMENTS: HeartRateWidget/HeartRateWidget.entitlements
